# nativeVersion: aumente só quando mudar o app Android (Java, C++, Node, permissões). Exige atualizar o APK.
# bundleVersion: o CI substitui pelo número da execução. Mudanças em src/ chegam sem trocar o APK.
nativeVersion=6
nativeName=1.2.0
bundleVersion=1
# playVersionCode: versionCode da versão da Google Play. Aumente a cada envio à Play, inclusive
# quando só mudar src/ (na Play não há atualização de pacote fora da loja).
playVersionCode=2
