plugins { id 'com.android.application' }

def v = new Properties()
file('../version.properties').withInputStream { v.load(it) }
def bundleVersion = (System.getenv('BUNDLE_VERSION') ?: v.bundleVersion).toInteger()
// Na Play não há atualização de pacote fora da loja: o pacote embutido acompanha o versionCode.
def playVersionCode = (System.getenv('PLAY_VERSION_CODE') ?: v.playVersionCode).toInteger()
def env = { String name -> System.getenv(name) ?: '' }
// Canal Developer: só a versão publicada (tag v*) é o app oficial; o resto é o Beta (nome, ícone e banner próprios).
def isBeta = !env('GITHUB_REF').startsWith('refs/tags/v')
// Canal Play: PLAY_BETA=1 gera o "IPTVKZ Beta" para o teste interno/fechado (mesmo pacote, versionName com "-beta").
// Sem ele, o "IPTVKZ" da produção; scripts/build-android.js só assina esse a partir de uma tag v*.
def playBeta = env('PLAY_BETA') == '1'
def hasKey = env('ANDROID_KEYSTORE') != ''

android {
    namespace 'com.lucasyemz.iptvkz'
    compileSdk 36
    ndkVersion '27.2.12479018' // r27c: libc++_shared em 16 KB (Google Play); o mesmo da libnode (.github/workflows/libnode.yml)

    defaultConfig {
        minSdk 24
        targetSdk 36 // Play: celular exige o Android 16 (API 36) desde 31/08/2026
        versionName v.nativeName
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared', "-DLIBNODE_DIR=${file('libnode')}"
            }
        }
    }

    signingConfigs {
        // Canal Developer (GitHub Releases): a mesma chave de sempre, para os APKs instalados continuarem atualizando.
        release {
            if (hasKey) {
                storeFile file(env('ANDROID_KEYSTORE'))
                storePassword env('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'iptvkz'
                keyPassword env('ANDROID_KEYSTORE_PASSWORD')
            }
        }
        // Canal Play: chave de upload. A chave do app fica com a Play (Play App Signing).
        playUpload {
            if (env('PLAY_UPLOAD_KEYSTORE')) {
                storeFile file(env('PLAY_UPLOAD_KEYSTORE'))
                storePassword env('PLAY_UPLOAD_KEYSTORE_PASSWORD')
                keyAlias env('PLAY_UPLOAD_KEY_ALIAS') ?: 'upload'
                keyPassword env('PLAY_UPLOAD_KEY_PASSWORD') ?: env('PLAY_UPLOAD_KEYSTORE_PASSWORD')
            }
        }
    }

    flavorDimensions 'channel'
    productFlavors {
        // APK independente: atualiza pelo GitHub Releases (pacote assinado + APK com confirmação).
        developer {
            dimension 'channel'
            applicationId 'com.lucasyemz.iptvkz'
            versionCode v.nativeVersion.toInteger()
            buildConfigField 'int', 'BUNDLE_VERSION', "${bundleVersion}"
            buildConfigField 'boolean', 'IS_BETA', "${isBeta}"
            // Só o app oficial (assinado com a chave do projeto) se atualiza pelo GitHub. O Beta gerado no PC é outro
            // pacote: atualizar por lá instalaria o IPTVKZ oficial ao lado, ou trocaria o código de teste pelo publicado.
            buildConfigField 'boolean', 'SELF_UPDATE', "${hasKey}"
            buildConfigField 'String', 'UPDATE_BASE', "\"${env('UPDATE_BASE') ?: 'https://github.com/kazamastudios/iptvkz/releases/latest/download/'}\""
            if (hasKey) {
                signingConfig signingConfigs.release
                // build de PR (teste) também aparece como Beta; só a versão publicada (tag v*) é "IPTVKZ"
                manifestPlaceholders = [appLabel: isBeta ? 'IPTVKZ Beta' : 'IPTVKZ']
            } else {
                // build no PC, sem a chave oficial: outro app, instalado ao lado do oficial
                signingConfig signingConfigs.debug
                applicationIdSuffix '.beta'
                versionNameSuffix '-beta'
                manifestPlaceholders = [appLabel: 'IPTVKZ Beta']
            }
        }
        // Google Play: só a loja atualiza. Sem baixar código, sem instalar APK.
        play {
            dimension 'channel'
            applicationId(project.findProperty('playApplicationId') ?: env('PLAY_APPLICATION_ID') ?: 'com.kazamastudios.iptvkz')
            versionCode playVersionCode
            buildConfigField 'int', 'BUNDLE_VERSION', "${playVersionCode}"
            buildConfigField 'boolean', 'IS_BETA', "${playBeta}"
            manifestPlaceholders = [appLabel: playBeta ? 'IPTVKZ Beta' : 'IPTVKZ']
            // aparece na Play Console ao criar a versão: "1.2.0-beta.5" nunca passa por versão de produção
            if (playBeta) versionNameSuffix "-beta.${playVersionCode}"
            // Sem chave de upload sai um AAB sem assinatura (só para conferir o build). Nunca a chave de debug.
            if (env('PLAY_UPLOAD_KEYSTORE')) signingConfig signingConfigs.playUpload
        }
    }

    buildFeatures { buildConfig true }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets {
        main { jniLibs.srcDirs = ['libnode/bin'] }
        // Beta: ícone e banner âmbar com o selo BETA (scripts/make-beta-icons.py)
        if (isBeta || !hasKey) developerRelease { res.srcDirs = ['src/beta/res'] }
        if (playBeta) playRelease { res.srcDirs = ['src/beta/res'] }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    aaptOptions { noCompress 'zip' }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Build de publicação na Play (PLAY_REQUIRE_SIGNING=1) não sai sem a chave de upload.
gradle.taskGraph.whenReady { graph ->
    def playRelease = graph.allTasks.any { it.name ==~ /(bundle|assemble|package)PlayRelease.*/ }
    if (playRelease && env('PLAY_REQUIRE_SIGNING') == '1' && !env('PLAY_UPLOAD_KEYSTORE')) {
        throw new GradleException('PLAY_UPLOAD_KEYSTORE não definida: o AAB da Play precisa da chave de upload.')
    }
}

dependencies {
    // FileProvider: só o canal Developer entrega o APK baixado ao instalador do sistema.
    developerImplementation 'androidx.core:core:1.13.1'
    // Play: só pergunta à loja se há versão nova (In-App Updates); quem baixa e instala é a Play.
    playImplementation 'com.google.android.play:app-update:2.1.0'
    // player nativo para o que o WebView não toca (MKV, H.265, áudio AC3/E-AC3/DTS)
    def media3 = '1.6.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    // decodificador de áudio FFmpeg reduzido (AC3, E-AC3, DTS, TrueHD), só quando o aparelho não abre o áudio
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:$media3+2"
}
