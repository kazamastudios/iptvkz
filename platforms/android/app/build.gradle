plugins { id 'com.android.application' }

def v = new Properties()
file('../version.properties').withInputStream { v.load(it) }
def bundleVersion = (System.getenv('BUNDLE_VERSION') ?: v.bundleVersion).toInteger()
// Na Play não há atualização de pacote fora da loja: o pacote embutido acompanha o versionCode.
def playVersionCode = (System.getenv('PLAY_VERSION_CODE') ?: v.playVersionCode).toInteger()
def env = { String name -> System.getenv(name) ?: '' }

android {
    namespace 'com.lucasyemz.iptvkz'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionName v.nativeName
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared', "-DLIBNODE_DIR=${file('libnode')}"
            }
        }
    }

    signingConfigs {
        // Canal Developer (GitHub Releases): a mesma chave de sempre, para os APKs instalados continuarem atualizando.
        release {
            if (env('ANDROID_KEYSTORE')) {
                storeFile file(env('ANDROID_KEYSTORE'))
                storePassword env('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'iptvkz'
                keyPassword env('ANDROID_KEYSTORE_PASSWORD')
            }
        }
        // Canal Play: chave de upload. A chave do app fica com a Play (Play App Signing).
        playUpload {
            if (env('PLAY_UPLOAD_KEYSTORE')) {
                storeFile file(env('PLAY_UPLOAD_KEYSTORE'))
                storePassword env('PLAY_UPLOAD_KEYSTORE_PASSWORD')
                keyAlias env('PLAY_UPLOAD_KEY_ALIAS') ?: 'upload'
                keyPassword env('PLAY_UPLOAD_KEY_PASSWORD') ?: env('PLAY_UPLOAD_KEYSTORE_PASSWORD')
            }
        }
    }

    flavorDimensions 'channel'
    productFlavors {
        // APK independente: atualiza pelo GitHub Releases (pacote assinado + APK com confirmação).
        developer {
            dimension 'channel'
            applicationId 'com.lucasyemz.iptvkz'
            versionCode v.nativeVersion.toInteger()
            buildConfigField 'int', 'BUNDLE_VERSION', "${bundleVersion}"
            buildConfigField 'String', 'UPDATE_BASE', "\"${env('UPDATE_BASE') ?: 'https://github.com/lucasyemz/iptvkz/releases/latest/download/'}\""
            signingConfig env('ANDROID_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
        // Google Play: só a loja atualiza. Sem baixar código, sem instalar APK.
        play {
            dimension 'channel'
            applicationId(project.findProperty('playApplicationId') ?: env('PLAY_APPLICATION_ID') ?: 'com.kazamastudios.iptvkz')
            versionCode playVersionCode
            buildConfigField 'int', 'BUNDLE_VERSION', "${playVersionCode}"
            // Sem chave de upload sai um AAB sem assinatura (só para conferir o build). Nunca a chave de debug.
            if (env('PLAY_UPLOAD_KEYSTORE')) signingConfig signingConfigs.playUpload
        }
    }

    buildFeatures { buildConfig true }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { jniLibs.srcDirs = ['libnode/bin'] } }
    packaging { jniLibs { useLegacyPackaging = true } }
    aaptOptions { noCompress 'zip' }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Build de publicação na Play (PLAY_REQUIRE_SIGNING=1) não sai sem a chave de upload.
gradle.taskGraph.whenReady { graph ->
    def playRelease = graph.allTasks.any { it.name ==~ /(bundle|assemble|package)PlayRelease.*/ }
    if (playRelease && env('PLAY_REQUIRE_SIGNING') == '1' && !env('PLAY_UPLOAD_KEYSTORE')) {
        throw new GradleException('PLAY_UPLOAD_KEYSTORE não definida: o AAB da Play precisa da chave de upload.')
    }
}

dependencies {
    // FileProvider: só o canal Developer entrega o APK baixado ao instalador do sistema.
    developerImplementation 'androidx.core:core:1.13.1'
}
