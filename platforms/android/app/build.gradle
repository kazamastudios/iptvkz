plugins { id 'com.android.application' }

def v = new Properties()
file('../version.properties').withInputStream { v.load(it) }
def bundleVersion = (System.getenv('BUNDLE_VERSION') ?: v.bundleVersion).toInteger()

android {
    namespace 'com.lucasyemz.iptvkz'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.lucasyemz.iptvkz'
        minSdk 24
        targetSdk 34
        versionCode v.nativeVersion.toInteger()
        versionName v.nativeName
        buildConfigField 'int', 'BUNDLE_VERSION', "${bundleVersion}"
        buildConfigField 'String', 'UPDATE_BASE', "\"${System.getenv('UPDATE_BASE') ?: 'https://github.com/lucasyemz/iptvkz/releases/latest/download/'}\""
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared', "-DLIBNODE_DIR=${file('libnode')}"
            }
        }
    }

    buildFeatures { buildConfig true }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { jniLibs.srcDirs = ['libnode/bin'] } }
    packaging { jniLibs { useLegacyPackaging = true } }
    aaptOptions { noCompress 'zip' }

    signingConfigs {
        release {
            def ks = System.getenv('ANDROID_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'iptvkz'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('ANDROID_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.core:core:1.13.1' }
