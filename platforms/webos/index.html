<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>IPTVKZ</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; color: #f4f4f8; font-family: "LG Smart", "Segoe UI", Arial, sans-serif; background: radial-gradient(ellipse at 20% 0%, #4d0d12 0%, rgba(77, 13, 18, 0) 60%), radial-gradient(ellipse at 90% 100%, #3a0716 0%, rgba(58, 7, 22, 0) 55%), #060609; }
  #boot { height: 100%; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  img { width: 756px; height: auto; }
  #track { position: relative; width: 480px; height: 6px; margin-top: 48px; border-radius: 6px; overflow: hidden; background: rgba(255, 255, 255, .14); }
  #fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 6px; background: #ff2a2a; }
  #fill.wait { width: 35%; -webkit-animation: wait 1.2s ease-in-out infinite; animation: wait 1.2s ease-in-out infinite; }
  @-webkit-keyframes wait { from { -webkit-transform: translateX(-110%); } to { -webkit-transform: translateX(300%); } }
  @keyframes wait { from { transform: translateX(-110%); } to { transform: translateX(300%); } }
  #msg { height: 40px; margin-top: 22px; font-size: 28px; color: #c9c9d8; text-align: center; }
  #retry { display: none; margin-top: 14px; font-size: 24px; color: #fff; }
</style>
</head>
<body>
<div id="boot">
  <img src="logo-horizontal.webp" alt="IPTVKZ" />
  <div id="track"><div id="fill" class="wait"></div></div>
  <div id="msg" role="status">Verificando se há atualizações</div>
  <div id="retry">Aperte OK para tentar de novo</div>
</div>
<script>
// Abertura do app da LG: mostra o progresso do serviço interno e abre a interface quando ele está pronto.
(function () {
  var SERVICE = 'luna://com.lucasyemz.iptvkz.service/boot';
  var LIMIT = 40000; // sem nenhum aviso do serviço nesse tempo, considera falha
  var bridge = null;
  var timer = null;
  var failed = false;
  var $ = function (id) { return document.getElementById(id); };

  function bar(percent) {
    if (percent == null) { $('fill').className = 'wait'; $('fill').style.width = ''; return; }
    $('fill').className = '';
    $('fill').style.width = percent + '%';
  }

  function say(text, percent) {
    $('msg').textContent = text;
    bar(percent);
  }

  function arm() {
    clearTimeout(timer);
    timer = setTimeout(function () { fail('O aplicativo não respondeu.'); }, LIMIT);
  }

  function fail(text) {
    clearTimeout(timer);
    failed = true;
    say(text, 0);
    $('retry').style.display = 'block';
  }

  function onState(s) {
    arm();
    if (s.phase === 'checking') say('Verificando se há atualizações');
    else if (s.phase === 'download') say('Baixando atualização ' + (s.percent || 0) + '%', s.percent || 0);
    else if (s.phase === 'installing') say('Instalando atualização', 100);
    else if (s.phase === 'restart') { say('Reiniciando o aplicativo', 100); setTimeout(start, 1500); }
    else if (s.phase === 'ready') {
      clearTimeout(timer);
      say('Abrindo', 100);
      location.replace('http://127.0.0.1:' + s.port + '/?tv=1');
    } else if (s.phase === 'error') fail('Não foi possível iniciar o aplicativo.');
  }

  function start() {
    failed = false;
    $('retry').style.display = 'none';
    say('Verificando se há atualizações');
    arm();
    var Bridge = window.WebOSServiceBridge || window.PalmServiceBridge;
    if (!Bridge) return fail('Este aparelho não é compatível.');
    bridge = new Bridge();
    bridge.onservicecallback = function (raw) {
      var s;
      try { s = JSON.parse(raw); } catch (e) { return; }
      if (s.returnValue === false) return fail('Não foi possível iniciar o aplicativo.');
      if (s.phase) onState(s);
    };
    bridge.call(SERVICE, JSON.stringify({ subscribe: true }));
  }

  document.addEventListener('keydown', function (e) {
    if (failed && e.keyCode === 13) start();
  });

  start();
})();
</script>
</body>
</html>
