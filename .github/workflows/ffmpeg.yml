# Componente opcional do PC: FFmpeg reduzido (lê MKV/TS/AVI, copia o vídeo, converte só o áudio para AAC).
# Roda quando o script de build muda; o resultado fica como artefato e é publicado à mão numa release própria.
name: FFmpeg do PC

on:
  push:
    paths:
      - scripts/build-ffmpeg.sh
      - .github/workflows/ffmpeg.yml
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win-x64, os: ubuntu-latest }
          - { target: linux-x64, os: ubuntu-latest }
          - { target: mac-arm64, os: macos-latest }
          - { target: mac-x64, os: macos-13 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm mingw-w64 zip > /dev/null
      - name: Ferramentas (Mac)
        if: runner.os == 'macOS'
        run: brew install nasm > /dev/null
      - run: bash scripts/build-ffmpeg.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: dist/desktop/componentes/*.zip
