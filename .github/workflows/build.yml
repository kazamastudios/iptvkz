# Gera os instaladores do IPTVKZ para Windows, macOS e Linux.
# - Em pull requests e no botão "Run workflow": compila e guarda os arquivos como artefatos.
# - Ao enviar uma tag "v*" (ex.: v1.0.0): compila e anexa tudo a um rascunho de Release.
name: Build

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # FFmpeg reduzido que vai dentro do app de PC (scripts/build-ffmpeg.sh): lê MKV/TS/AVI, copia o vídeo e converte
  # só o áudio (AC3, DTS...) para AAC. Licença LGPL, sem partes GPL. O Windows é compilado no Linux.
  ffmpeg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win-x64, os: ubuntu-latest }
          - { target: linux-x64, os: ubuntu-latest }
          - { target: mac-arm64, os: macos-latest }
          - { target: mac-x64, os: macos-13 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: dist/desktop/componentes
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Ferramentas
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm mingw-w64 zip > /dev/null
      - name: Ferramentas (Mac)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install nasm > /dev/null
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: dist/desktop/componentes/*.zip

  build:
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Gerar versão para TVs antigas e bibliotecas do player
        run: |
          npm run build
          npm run vendor

      - name: FFmpeg para o app
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: dist/desktop/componentes
          merge-multiple: true

      - name: Compilar instaladores
        run: |
          node scripts/build-desktop.js ${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          BUNDLE_VERSION: ${{ github.run_number }} # número da build mostrado no app (scripts/build-info.js)

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVKZ-${{ runner.os }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.AppImage
            dist/desktop/*.deb
          if-no-files-found: error
          retention-days: 14

  webos:
    # App da LG em dois canais:
    # - Developer (dist/webos): BUNDLE_VERSION cresce a cada build, como no Android; vai para a Release.
    # - Store (dist/webos/store): IPK da LG Content Store, sem atualização automática. Só artefato:
    #   o envio ao LG Seller Lounge é manual, e nada aqui publica na loja.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Gerar versão para TVs antigas e bibliotecas do player
        run: |
          npm run build
          npm run vendor

      - name: Preparar chave de atualização
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATE_KEY: ${{ secrets.ANDROID_UPDATE_KEY }}
        run: |
          echo "$UPDATE_KEY" > "$RUNNER_TEMP/update.pem"
          echo "ANDROID_UPDATE_KEY=$RUNNER_TEMP/update.pem" >> "$GITHUB_ENV"

      - name: Gerar IPK
        run: npm run ipk
        env:
          BUNDLE_VERSION: ${{ github.run_number }}

      - name: Testes do servidor
        run: npm test

      - name: Gerar IPK da LG Content Store
        run: npm run ipk:store

      - name: Anexar à Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" dist/webos/*.ipk dist/webos/IPTVKZ-webos-bundle.gz dist/webos/webos-update.json dist/webos/webos-update.json.sig --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVKZ-webOS
          path: |
            dist/webos/*.ipk
            dist/webos/IPTVKZ-webos-bundle.gz
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVKZ-webOS-Store
          path: dist/webos/store/*.ipk
          if-no-files-found: error
          retention-days: 30

  android:
    # Depois dos instaladores, para anexar ao mesmo rascunho de Release.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Gerar versão para TVs antigas e bibliotecas do player
        run: |
          npm run build
          npm run vendor

      - name: Instalar NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null

      # Chave do APK também nos PRs deste repositório (de forks não, que nem recebem secrets): o APK de teste
      # instala por cima do oficial e de outros testes, sem desinstalar e perder as listas.
      - name: Preparar chave de assinatura do APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      # Chave das atualizações automáticas: só nas versões oficiais. Um PR nunca vira atualização para os aparelhos.
      - name: Preparar chave de atualização
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATE_KEY: ${{ secrets.ANDROID_UPDATE_KEY }}
        run: |
          echo "$UPDATE_KEY" > "$RUNNER_TEMP/update.pem"
          echo "ANDROID_UPDATE_KEY=$RUNNER_TEMP/update.pem" >> "$GITHUB_ENV"

      - name: Compilar APK da Android TV
        run: npm run android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_VERSION: ${{ github.run_number }}

      - name: Anexar à Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" dist/android/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVKZ-Android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
