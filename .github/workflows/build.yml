# Gera os instaladores do IPTVKZ para Windows, macOS e Linux, o IPK da LG e o APK Android do canal Developer.
# A versão da Google Play (AAB) tem um fluxo separado: play.yml.
# - Em pull requests e no botão "Run workflow": compila e guarda os arquivos como artefatos.
# - Ao enviar uma tag "v*" (ex.: v1.0.0): compila e anexa tudo a um rascunho de Release.
name: Build

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # O que este PR mudou: cada job roda só quando os arquivos dele mudam (um PR só da landing page, em public/,
  # não roda nada). Tag v* e o botão "Run workflow" rodam tudo. src/ é o app de todas as plataformas.
  changes:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.o.outputs.test }}
      web: ${{ steps.o.outputs.web }}
      desktop: ${{ steps.o.outputs.desktop }}
      webos: ${{ steps.o.outputs.webos }}
      android: ${{ steps.o.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3
        id: f
        if: github.event_name == 'pull_request'
        with:
          filters: |
            app: ['src/**', 'package.json', 'package-lock.json', 'scripts/build-legacy.js', 'scripts/test-old-browser*.js', 'scripts/make-*', 'scripts/build-info.js', 'scripts/vendor.js', '.github/workflows/build.yml']
            server: ['src/server/**', 'scripts/test-server.js', 'package.json', 'package-lock.json']
            desktop: ['platforms/desktop/**', 'scripts/build-desktop.js', 'scripts/build-ffmpeg.sh', 'assets/brand/**']
            webos: ['platforms/webos/**', 'scripts/build-ipk.js', 'scripts/check-webos.js', 'assets/brand/**', 'platforms/android/app/src/developer/res/values/update_key.xml']
            android: ['platforms/android/**', 'scripts/build-android.js', 'scripts/test-android-boot.js', 'assets/brand/**']
      - id: o
        run: |
          all=${{ github.event_name != 'pull_request' }}
          on() { if [ "$all" = true ] || [ "$1" = true ] || [ "$2" = true ]; then echo true; else echo false; fi; }
          echo "test=$(on '${{ steps.f.outputs.server }}')" >> "$GITHUB_OUTPUT"
          echo "web=$(on '${{ steps.f.outputs.app }}')" >> "$GITHUB_OUTPUT"
          echo "desktop=$(on '${{ steps.f.outputs.app }}' '${{ steps.f.outputs.desktop }}')" >> "$GITHUB_OUTPUT"
          echo "webos=$(on '${{ steps.f.outputs.app }}' '${{ steps.f.outputs.webos }}')" >> "$GITHUB_OUTPUT"
          echo "android=$(on '${{ steps.f.outputs.app }}' '${{ steps.f.outputs.android }}')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # FFmpeg reduzido que vai dentro do app de PC (scripts/build-ffmpeg.sh): lê MKV/TS/AVI, copia o vídeo e converte
  # só o áudio (AC3, DTS...) para AAC. Licença LGPL, sem partes GPL. O Windows é compilado no Linux.
  ffmpeg:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win-x64, os: ubuntu-latest }
          - { target: linux-x64, os: ubuntu-latest }
          - { target: mac-arm64, os: macos-latest }
          - { target: mac-x64, os: macos-latest } # compilado para Intel no Mac M1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: dist/desktop/componentes
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Ferramentas
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm mingw-w64 zip > /dev/null
      - name: Ferramentas (Mac)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install nasm > /dev/null
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: dist/desktop/componentes/*.zip
          retention-days: 1 # só passa para o job dos instaladores deste mesmo run (o FFmpeg fica no cache)

  # Testes do servidor. Nenhum job depende deste: se falhar, avisa sem travar os instaladores.
  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

  # Piso de navegador: o app (versão legacy) num Chromium sem o que o Chromium 51 não tem (WebView do Android 7.0,
  # TV box antiga), passando pelas telas no modo PC e no modo TV. Pega função nova usada sem substituto antes de
  # ela chegar aos aparelhos. Também confere se o app.legacy.js commitado está em dia com o código.
  piso-navegador:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: app.legacy.js em dia (rode npm run build e faça o commit)
        run: |
          npm run build
          git diff --exit-code --stat -- src/web/js/app.legacy.js

      - name: Abrir o app no piso Chromium 51
        run: xvfb-run -a npx electron scripts/test-old-browser.js

  build:
    needs: [changes, ffmpeg]
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Gerar versão para TVs antigas e bibliotecas do player
        run: |
          npm run build
          npm run vendor

      - name: FFmpeg para o app
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: dist/desktop/componentes
          merge-multiple: true

      - name: Compilar instaladores
        run: |
          node scripts/build-desktop.js ${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          BUNDLE_VERSION: ${{ github.run_number }} # número da build mostrado no app (scripts/build-info.js)

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVKZ-${{ runner.os }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.AppImage
            dist/desktop/*.deb
          if-no-files-found: error
          # PR: só para testar (5 dias). Tag v* e "Run workflow": 14 dias (a versão publicada fica na Release).
          retention-days: ${{ github.event_name == 'pull_request' && 5 || 14 }}

  webos:
    # App da LG em dois canais:
    # - Developer (dist/webos): BUNDLE_VERSION cresce a cada build, como no Android; vai para a Release.
    # - Store (dist/webos/store): IPK da LG Content Store, sem atualização automática. Só artefato:
    #   o envio ao LG Seller Lounge é manual, e nada aqui publica na loja.
    # Espera os instaladores do PC (mesmo rascunho de Release), mas roda também quando eles não rodaram.
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.webos == 'true' && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Gerar versão para TVs antigas e bibliotecas do player
        run: |
          npm run build
          npm run vendor

      - name: Preparar chave de atualização
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATE_KEY: ${{ secrets.ANDROID_UPDATE_KEY }}
        run: |
          echo "$UPDATE_KEY" > "$RUNNER_TEMP/update.pem"
          echo "ANDROID_UPDATE_KEY=$RUNNER_TEMP/update.pem" >> "$GITHUB_ENV"

      - name: Gerar IPK
        run: npm run ipk
        env:
          BUNDLE_VERSION: ${{ github.run_number }}

      - name: Testes do servidor
        run: npm test

      - name: Gerar IPK da LG Content Store
        run: npm run ipk:store

      - name: Anexar à Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" dist/webos/*.ipk dist/webos/IPTVKZ-webos-bundle.gz dist/webos/webos-update.json dist/webos/webos-update.json.sig --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVKZ-webOS
          path: |
            dist/webos/*.ipk
            dist/webos/IPTVKZ-webos-bundle.gz
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 5 || 14 }}

  # O APK abre de verdade com o Node de 32 bits (armeabi-v7a), o das TV box antigas: emulador Android 11 x86, que
  # traduz apps ARM de 32 bits. Os aparelhos do dia a dia (Mecool, celular) usam o de 64 bits.
  android-32:
    needs: [changes, android]
    if: ${{ !cancelled() && needs.android.result == 'success' && !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # WebSocket nativo, para ler a página do app

      - uses: actions/download-artifact@v4
        with:
          name: IPTVKZ-Android
          path: dist/android

      - name: Ligar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir o APK com o Node de 32 bits
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: node scripts/test-android-boot.js dist/android/IPTVKZ-android.apk armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVKZ-webOS-Store
          path: dist/webos/store/*.ipk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 5 || 30 }}

  android:
    # Depois dos instaladores, para anexar ao mesmo rascunho de Release (roda também quando eles não rodaram).
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.android == 'true' && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Gerar versão para TVs antigas e bibliotecas do player
        run: |
          npm run build
          npm run vendor

      - name: Instalar NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      # Chave do APK também nos PRs deste repositório (de forks não, que nem recebem secrets): o APK de teste
      # instala por cima do oficial e de outros testes, sem desinstalar e perder as listas.
      - name: Preparar chave de assinatura do APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      # Chave das atualizações automáticas: só nas versões oficiais. Um PR nunca vira atualização para os aparelhos.
      - name: Preparar chave de atualização
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATE_KEY: ${{ secrets.ANDROID_UPDATE_KEY }}
        run: |
          echo "$UPDATE_KEY" > "$RUNNER_TEMP/update.pem"
          echo "ANDROID_UPDATE_KEY=$RUNNER_TEMP/update.pem" >> "$GITHUB_ENV"

      - name: Compilar APK da Android TV
        run: npm run android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_VERSION: ${{ github.run_number }}

      - name: Anexar à Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" dist/android/IPTVKZ-android.apk dist/android/IPTVKZ-android-bundle.zip dist/android/android-update.json dist/android/android-update.json.sig --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVKZ-Android
          path: |
            dist/android/*.apk
            dist/android/*.zip
            dist/android/android-update.json*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 5 || 14 }}
